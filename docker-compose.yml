services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sailes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: sailes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sailes -d sailes"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    image: sailes:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://sailes:${POSTGRES_PASSWORD}@db:5432/sailes
      SAILES_ADMIN_EMAIL: ${SAILES_ADMIN_EMAIL:-}
      SAILES_ADMIN_PASSWORD: ${SAILES_ADMIN_PASSWORD:-}
      SAILES_ADMIN_NAME: ${SAILES_ADMIN_NAME:-}
      SAILES_SEED_DEMO: ${SAILES_SEED_DEMO:-false}
      SAILES_SECURE_COOKIES: ${SAILES_SECURE_COOKIES:-false}
    ports:
      - "${SAILES_PORT:-8080}:8080"

volumes:
  pgdata:
